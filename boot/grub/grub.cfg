insmod all_video
insmod gfxterm

serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input console serial
set gfxmode=1024x768x32,800x600x32,auto
terminal_output gfxterm serial
set gfxpayload=keep

set timeout=5
set default=0

menuentry "Ender-OS v0.5 (Grafik Framebuffer + Konsol)" {
    linux /boot/bzImage console=ttyS0 console=tty0 quiet loglevel=3
    initrd /boot/initramfs.cpio.gz
}

menuentry "Ender-OS v0.5 (Seri Konsol - QEMU -nographic)" {
    linux /boot/bzImage console=tty0 console=ttyS0 quiet loglevel=3
    initrd /boot/initramfs.cpio.gz
}
